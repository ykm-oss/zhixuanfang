spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ds?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  redis:
    host: localhost
    port: 6379
    password:
    database: 0

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.shop.entity

knife4j:
  enable: true
  setting:
    enable-swagger-models: true
    enable-document-manage: true
    enable-host: false
    enable-host-text: localhost:8080

jwt:
  secret: shopDemoSecret123456
  expire: 86400000

